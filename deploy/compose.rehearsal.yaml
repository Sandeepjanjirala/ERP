# The local production rehearsal (e2e/rehearse_deploy.py): the production stack, plus Mailpit
# so emails can be read instead of sent. Never used on a real server.
x-mail: &mail
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "0"

services:
  web:
    environment: *mail
  worker:
    environment: *mail
  beat:
    environment: *mail
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-18025}:8025"
