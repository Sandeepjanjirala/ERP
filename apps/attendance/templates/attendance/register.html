{% extends "base.html" %}
{% load ui %}

{% block content %}
  <section class="card">
    <form method="get" class="filter-bar">
      {{ selection }}
      <button class="btn" type="submit">Open register {% icon 'arrow-right' %}</button>
    </form>
  </section>

  {% if classroom %}
    {% include "attendance/_register.html" %}
  {% endif %}

  <p class="footnote">Present and late count as attended. Excused days are excluded from the attendance percentage. Unrecorded days are not counted.</p>
{% endblock %}
