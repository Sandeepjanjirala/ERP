name: Django checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vidya
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: vidya
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vidya -d vidya"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DEBUG: '1'
      DJANGO_SECRET_KEY: 'ci-only-test-key-never-for-a-deployed-environment-483920184'
      DATABASE_URL: 'postgresql://vidya:ci-local-only@localhost:5432/vidya?sslmode=disable'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test --settings=school.test_settings --noinput
