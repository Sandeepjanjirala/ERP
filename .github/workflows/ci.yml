name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: edunexa
          POSTGRES_PASSWORD: ci-local-only
          POSTGRES_DB: edunexa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U edunexa -d edunexa"
          --health-interval 5s --health-timeout 5s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DJANGO_SECRET_KEY: ci-only-test-key-never-for-a-deployed-environment-483920184
      DATABASE_URL: postgresql://edunexa:ci-local-only@localhost:5432/edunexa?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - run: pip install -r requirements/dev.txt
      - name: Migrations match the models
        run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass Django's deployment checklist
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          ALLOWED_HOSTS: edunexa.example.com
      - name: Static files build
        run: python manage.py collectstatic --noinput
      - name: API schema is valid OpenAPI, with no warnings
        run: python manage.py spectacular --validate --fail-on-warn --file openapi.yml
      - name: Tests, including concurrent writes on PostgreSQL
        run: pytest --cov --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=85
      - name: A Celery worker runs jobs through Redis
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev
          REDIS_URL: redis://localhost:6379/0
        run: |
          celery -A config worker --pool=solo --loglevel=info --detach --logfile=celery.log
          python manage.py check_jobs --timeout 30 || { cat celery.log; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
      - uses: actions/upload-artifact@v7
        with:
          name: openapi-schema
          path: openapi.yml

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag edunexa:ci .
