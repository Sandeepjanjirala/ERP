{% extends "base.html" %}
{% load ui %}

{% block content %}
  <section class="card card-narrow">
    {% if description %}<p class="form-intro">{{ description }}</p>{% endif %}
    <form method="post" class="form-stack">
      {% csrf_token %}
      {{ form }}
      <div class="form-actions">
        <button class="btn" type="submit">Save details {% icon 'arrow-right' %}</button>
        <a href="{% url 'dashboard' %}">Back to overview</a>
      </div>
    </form>
  </section>
{% endblock %}
