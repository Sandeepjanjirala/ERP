services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vidya
      POSTGRES_USER: vidya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup_local.py or configure .env first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidya -d vidya"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://vidya:${POSTGRES_PASSWORD}@db:5432/vidya?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "python manage.py migrate && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 60"
volumes:
  postgres_data:
